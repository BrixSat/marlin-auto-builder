# Ender-5 — Creality 1.1.x board (Melzi, ATmega1284P, 128 KB flash), 220x220x300 bed
DESCRIPTION="Ender-5 (Creality 1.1.x / Melzi) — BLTouch + bilinear ABL"

# PlatformIO environment to build. Must match the board.
# melzi_optiboot_optimized = Optiboot bootloader (USB 115200) + size-tuned flags.
PIO_ENV="melzi_optiboot_optimized"

# Marlin version to build against. "latest" = newest stable GitHub release,
# picked up automatically with no edits needed when Marlin publishes a release.
# Pin a specific tag (e.g. "2.1.2.8") only if a newer release breaks the build.
MARLIN_VERSION="latest"
